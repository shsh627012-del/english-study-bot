name: 학습 데이터 커밋
description: docs/data 와 docs/audio 의 변경사항을 리포에 커밋한다.

inputs:
  message:
    description: 커밋 메시지
    required: true

runs:
  using: composite
  steps:
    - name: 커밋 & 푸시
      shell: bash
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/data docs/audio

        if git diff --staged --quiet; then
          echo "변경사항 없음 — 커밋하지 않습니다."
          exit 0
        fi

        git commit -m "${{ inputs.message }}"

        # 다른 워크플로우가 먼저 밀어넣었을 수 있으므로 rebase 후 재시도한다.
        for attempt in 1 2 3; do
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
            echo "푸시 완료 (시도 ${attempt}회)"
            exit 0
          fi
          echo "푸시 실패, 재시도합니다 (${attempt}/3)"
          sleep 5
        done
        echo "::error::3회 시도 후에도 푸시하지 못했습니다."
        exit 1
